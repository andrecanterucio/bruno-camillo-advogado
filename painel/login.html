<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17181d">
<title>Entrar | Bruno Camillo Advogado</title>
<link rel="icon" type="image/png" href="/assets/logo-escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/painel-assets/painel.css">
</head>
<body>
<main class="login">
  <form class="box stack" id="f" autocomplete="on">
    <img src="/assets/logo-escudo.png" alt="Bruno Camillo Advogado">
    <div><h1>Área restrita</h1><p class="sub">Equipe e clientes do escritório</p></div>
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
    <p class="notice bad small" id="err" hidden role="alert"></p>
    <button class="btn gold w100" id="ok" type="submit">Entrar</button>
    <p class="small muted tc">Problemas para entrar? Fale com o escritório.<br><a href="/">Voltar ao site</a></p>
  </form>
</main>
<script type="module" src="/painel-assets/login.js"></script>
</body>
</html>
